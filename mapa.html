<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa · Mesa Sonora</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317130f'/%3E%3Cpath d='M16 5l9 5v11l-9 5-9-5V10z' stroke='%23d0a54c' stroke-width='2.2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#17130f; --bg2:#1f1914; --card:#2a221b; --card2:#332a21; --line:#4a3d30;
  --ink:#eee2c9; --ink2:#b9a88a; --ink3:#86765d;
  --brass:#d0a54c; --brass-ink:#1c150c;
  --display:"Almendra", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#0d0b09;color:var(--ink);font:15px/1.4 var(--body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#board{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#board.panning{cursor:grabbing}
#board.t-ruler,#board.t-draw,#board.t-fog{cursor:crosshair}
#board.t-erase{cursor:cell}

.topbar{position:fixed;top:10px;left:74px;right:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:5}
.topbar > *{pointer-events:auto}
.title{font:700 22px/1 var(--display);color:var(--brass);padding:8px 12px;background:rgba(23,19,15,.88);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(4px)}
.title small{font:500 12px/1 var(--body);color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(42,34,27,.92);padding:7px 12px;border-radius:8px;font-weight:500;backdrop-filter:blur(4px)}
.btn:hover{background:var(--card2)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:700}
.btn.small{padding:5px 9px;font-size:13px}
.btn.danger{color:#f0a090}
.btn svg{width:17px;height:17px;flex:none}
.btn[aria-pressed=true]{border-color:var(--brass);color:var(--brass)}
.zoom{display:flex;align-items:center;gap:4px}
.zoom span{min-width:46px;text-align:center;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}

.tools{position:fixed;left:10px;top:10px;display:flex;flex-direction:column;gap:4px;padding:6px;background:rgba(23,19,15,.92);border:1px solid var(--line);border-radius:12px;z-index:6;backdrop-filter:blur(4px)}
.tool{width:44px;height:44px;border-radius:9px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--ink2);position:relative}
.tool svg{width:24px;height:24px}
.tool:hover{background:var(--card);color:var(--ink)}
.tool[aria-pressed=true]{background:var(--brass);color:var(--brass-ink)}
.tool .k{position:absolute;right:3px;bottom:1px;font-size:10px;font-weight:700;opacity:.6}
.tools hr{width:100%;border:0;border-top:1px solid var(--line);margin:3px 0}

.flyout{position:fixed;left:70px;background:rgba(31,25,20,.97);border:1px solid var(--line);border-radius:12px;padding:12px;z-index:6;width:250px;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.flyout h4{margin:0 0 8px;font:700 17px/1 var(--display);color:var(--brass)}
.flyout .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.flyout .lbl{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin:2px 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:var(--card);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed=true]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:700}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.sw[aria-pressed=true]{border-color:#fff}
input[type=range]{accent-color:var(--brass);width:100%}
.hint{font-size:12px;color:var(--ink3);margin:0}

.panel{position:fixed;right:10px;top:60px;width:320px;max-height:calc(100vh - 70px);overflow:auto;background:rgba(31,25,20,.97);border:1px solid var(--line);border-radius:14px;padding:16px;z-index:7;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.panel h3{margin:0 0 12px;font:700 22px/1 var(--display);color:var(--brass);display:flex;align-items:center}
.panel h3 button{margin-left:auto}
.panel label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
.panel input[type=text],.panel input[type=url],.panel input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.panel .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel .sect{border-top:1px solid var(--line);margin-top:14px;padding-top:6px}
.panel .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chk{display:flex!important;align-items:center;gap:8px;cursor:pointer}
.chk input{accent-color:var(--brass);width:16px;height:16px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:9px 16px;border-radius:10px;z-index:20;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.empty-map{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:1}
.empty-map div{pointer-events:auto;text-align:center;background:rgba(23,19,15,.9);border:1px dashed var(--line);border-radius:14px;padding:22px 26px;max-width:380px;color:var(--ink2)}
.empty-map b{display:block;font:700 22px/1.1 var(--display);color:var(--brass);margin-bottom:6px}
.status{position:fixed;right:10px;bottom:10px;font-size:12px;color:var(--ink3);background:rgba(23,19,15,.8);padding:4px 10px;border-radius:8px;z-index:5}
.gate{position:fixed;inset:0;display:grid;place-items:center;background:#0d0b09;z-index:30;color:var(--ink2);padding:16px;text-align:center}
@media (max-width:640px){.title small{display:none}.panel{left:10px;right:10px;width:auto}}

/* painel do token */
.tokpanel{width:380px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-2px 0 6px}
.tabs button{border:1px solid transparent;border-bottom:0;background:transparent;padding:7px 12px;border-radius:8px 8px 0 0;color:var(--ink2);font-weight:500;margin-bottom:-1px}
.tabs button[aria-selected=true]{background:var(--card);border-color:var(--line);color:var(--brass);font-weight:700}
.panel select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}
.panel input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.panel input[type=color].wide{width:100%}
.barrow{display:grid;grid-template-columns:16px 1fr 12px 1fr 42px;gap:6px;align-items:center;margin-bottom:6px}
.barrow span{color:var(--ink3);font-weight:700;font-size:13px}
.barrow em{font-style:normal;color:var(--ink3);text-align:center}
.barrow input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;text-align:center}
.dirpad{display:grid;grid-template-columns:repeat(3,34px);gap:3px;margin-top:8px}
.dirpad button,.dirpad span{width:34px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:16px}
.dirpad span{border-color:transparent;background:transparent;color:var(--ink3)}
.dirpad button[aria-pressed=true]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.unitin{display:flex;align-items:center;gap:8px}
.unitin input{flex:1}
.unitin span{color:var(--ink2)}
.chk.big{font-size:16px;color:var(--ink)!important}
.tokprev{display:grid;place-items:center;margin:12px 0}
.foot{border-top:1px solid var(--line);padding-top:12px;align-items:center}
.foot .spacer{flex:1}

/* v9: luz, paredes, barra do token */
.seg.light{background:rgba(23,19,15,.88);padding:3px;border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(4px)}
.seg.light button{padding:5px 9px}
.sub-h{font:700 16px/1 var(--display);color:var(--brass);border-bottom:1px solid var(--line);padding:12px 0 6px;margin-bottom:6px}
.grid3{display:grid;grid-template-columns:1fr 90px 44px;gap:6px 8px;align-items:center}
.grid3 label{margin:0!important}
.grid3 input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.grid3 span{color:var(--ink3);font-size:13px}
.selbar{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(23,19,15,.94);border:1px solid var(--brass);border-radius:12px;padding:6px 10px;z-index:6;box-shadow:0 10px 26px rgba(0,0,0,.5);max-width:calc(100vw - 20px)}
.selbar b{font:700 16px/1 var(--display);color:var(--brass);margin-right:4px}
.tlrow{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(74,61,48,.5)}
.tldot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.tlname{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 2px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlname em{font-style:normal;color:#e0735e;font-size:12px}
.tlname small{color:var(--ink3)}

/* v10: vida no token e dados */
.selbar{flex-direction:column;align-items:stretch}
.sbrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.sbbar{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border-radius:9px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.sbbar i{width:10px;height:10px;border-radius:3px;background:var(--bc);margin-right:2px}
.sbbar .btn.small{padding:4px 7px;font-weight:700;font-variant-numeric:tabular-nums}
.sbv{width:54px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:4px 4px;font-weight:700;color:var(--ink)}
.sbbar em{font-style:normal;color:var(--ink3);font-size:13px}
.dice-dock{position:fixed;left:10px;bottom:10px;z-index:8;display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:min(340px,calc(100vw - 20px));pointer-events:none}
.dice-dock > *{pointer-events:auto}
.dice-toggle{font-weight:700;color:var(--brass);border-color:color-mix(in srgb,var(--brass) 55%,var(--line))}
.dpanel{background:rgba(31,25,20,.97);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;box-shadow:0 12px 28px rgba(0,0,0,.45)}
.dmenu{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:8px}
.dpick{position:relative;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 0;display:grid;place-items:center}
.dpick.on{border-color:var(--brass)}
.dpick:hover{background:var(--card2)}
.dbadge{position:absolute;top:-6px;right:-5px;min-width:18px;padding:1px 5px;border-radius:999px;background:var(--brass);color:var(--brass-ink);font:700 11px/1.2 var(--body)}
.drow{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.drow b{min-width:26px;text-align:center;color:var(--ink)}
.drow .spacer{flex:1}
.dform{margin-left:auto;font-weight:700;color:var(--ink)}
.die{position:relative;display:inline-grid;place-items:center;width:30px;height:30px}
.die::before{content:"";position:absolute;inset:0;clip-path:var(--shape);background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--dc) 60%,#fff),var(--dc) 45%,color-mix(in srgb,var(--dc) 55%,#000))}
.die-n{position:relative;font:700 11px/1 var(--body);color:#1a130b}
.die.d4 .die-n{transform:translateY(22%)}
.die.mini{width:28px;height:28px}
.die.mini .die-n{font-size:11px}
.die.c20::before{background:radial-gradient(circle at 35% 28%,#fff6c8,#e8c14a 45%,#8a6a12)}
.die.c20{filter:drop-shadow(0 0 8px rgba(240,200,80,.9))}
.die.c1::before{background:radial-gradient(circle at 35% 28%,#e8a79b,#9c3526 50%,#4a140c)}
.dlog{display:flex;flex-direction:column;gap:6px;width:100%;max-height:46vh;overflow:auto}
.droll{position:relative;display:grid;grid-template-columns:1fr auto;grid-template-areas:"who tot" "faces tot" "tag tag";gap:2px 10px;background:rgba(23,19,15,.93);border:1px solid var(--line);border-radius:10px;padding:7px 10px;box-shadow:0 8px 20px rgba(0,0,0,.35);animation:dIn .25s ease-out}
.droll.secret{border-style:dashed}
.droll.crit{border-color:#e8c14a;box-shadow:0 0 18px rgba(232,193,74,.45)}
.droll.fumble{border-color:#9c3526;box-shadow:0 0 18px rgba(156,53,38,.45)}
.dwho{grid-area:who;font-weight:700;color:var(--ink);font-size:14px}
.dwho span{font-weight:500;color:var(--ink3);margin-left:6px;font-size:12px}
.dfaces{grid-area:faces;display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.droll.fresh .die{animation:dShake .12s linear infinite}
.dmod{font-weight:700;color:var(--ink2);margin-left:4px}
.dtot{grid-area:tot;align-self:center;font:700 30px/1 var(--display);color:var(--brass);min-width:34px;text-align:right}
.droll.crit .dtot{color:#ffe28a;text-shadow:0 0 14px rgba(255,210,90,.8)}
.droll.fumble .dtot{color:#e0735e}
.dtag{grid-area:tag;font-weight:700;font-size:12px;color:#ffe28a}
.droll.fumble .dtag{color:#e0735e}
@keyframes dIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes dShake{0%{rotate:-10deg}50%{rotate:10deg}100%{rotate:-10deg}}
.status{bottom:auto;top:58px}

/* v11: barra e mesa de dados */
.dice-dock{display:none!important}
.dlog{position:fixed;left:10px;bottom:10px;z-index:8;display:flex;flex-direction:column;gap:6px;width:min(300px,calc(100vw - 20px));max-height:44vh;overflow:auto;pointer-events:none}
.dlog > *{pointer-events:auto}
.dicebar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 640px);min-width:min(420px,calc(100vw - 20px))}
@media (max-width:1100px){.dicebar{max-width:calc(100vw - 20px);bottom:auto;top:58px}}
.dice-main{flex:none;font-weight:700;font-size:16px;padding:10px 18px;background:linear-gradient(180deg,#e0b95e,#b8892f);color:var(--brass-ink);border-color:#e0b95e;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.dice-main:hover{filter:brightness(1.08);background:linear-gradient(180deg,#e0b95e,#b8892f)}
.presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding:2px}
.pchip{flex:none;flex-direction:column;align-items:flex-start;gap:0;padding:5px 11px;line-height:1.15}
.pchip small{font-size:11px;color:var(--ink3)}
.pchip:hover{border-color:var(--brass)}
.pedit{align-items:center;justify-content:center;font-size:16px;color:var(--brass)}
.selbar{bottom:76px}
.dmodal-wrap{position:fixed;inset:0;z-index:40;background:rgba(8,6,5,.55);display:grid;place-items:center;padding:16px}
.dmodal{width:min(940px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.dm-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.dm-head b{font:700 28px/1 var(--display);color:var(--brass)}
.dm-head .sub{color:var(--ink3);font-size:13px;margin-right:auto}
.dm-body{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}
@media (max-width:800px){.dm-body{grid-template-columns:1fr}}
.dm-menu{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px}
@media (max-width:640px){.dm-menu{grid-template-columns:repeat(4,1fr)}}
.dm-die{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.dm-die.on{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 16%,var(--card))}
.dm-pick{position:relative;border:0;background:transparent;padding:2px;transition:transform .08s}
.dm-pick:hover{transform:scale(1.08) rotate(-5deg)}
.die.card{width:48px;height:48px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.die.card .die-n{font-size:16px}
.dm-lbl{font:700 15px/1 var(--display)}
.dm-ctl{display:flex;align-items:center;gap:2px}
.dm-ctl .dstep{width:24px;height:24px;font-size:15px}
.dm-ctl span{min-width:16px;text-align:center;font-weight:700}
.dm-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dm-row input#dmText{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-weight:700;font-size:16px}
.dm-k{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px}
.dm-row .dm-k{margin:0}
.dm-mod{min-width:30px;text-align:center;font-size:18px}
.dm-row .spacer{flex:1}
.dm-roll{font-size:17px;padding:10px 22px}
.dm-err{color:#f0a090;font-size:13px;min-height:1.1em;margin:-4px 0 6px}
.dm-result{min-height:150px;border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;text-align:center}
.dm-result.crit{border:1px solid #e8c14a;box-shadow:inset 0 0 40px rgba(232,193,74,.2)}
.dm-result.fumble{border:1px solid #9c3526;box-shadow:inset 0 0 40px rgba(156,53,38,.25)}
.dm-faces{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.die.big2{width:56px;height:56px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.die.big2 .die-n{font-size:20px}
.die.drop{opacity:.3;filter:grayscale(1)}
.dm-total{font:700 56px/1 var(--display);color:var(--brass)}
.dm-result.crit .dm-total{color:#ffe28a;text-shadow:0 0 22px rgba(255,210,90,.8)}
.dm-result.fumble .dm-total{color:#e0735e}
.crit-tag,.fumble-tag{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700}
.crit-tag{background:#e8c14a;color:#2a1d05}.fumble-tag{background:#9c3526;color:#fbe3dc}
.dm-pres{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;max-height:240px;overflow:auto}
.dm-pre{display:grid;grid-template-columns:1.2fr 1fr auto auto auto;gap:4px}
.dm-pre input{min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.dm-hist{font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:3px;max-height:170px;overflow:auto}
.dm-hist .crit{color:#ffe28a}.dm-hist .fumble{color:#e0735e}
.droll .dwho i{font-style:normal;color:var(--brass)}

/* v12: palco dos dados no meio da tela */
.dstage{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(10,8,6,.55),rgba(6,5,4,.82));animation:dsIn .25s ease-out;cursor:pointer;padding:16px}
.dstage.out{animation:dsOut .3s ease-in forwards}
.ds-card{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:min(920px,100%)}
.ds-who{font-size:20px;color:var(--ink2)}.ds-who b{color:var(--ink);font:700 26px/1 var(--display)}.ds-who i{font-style:normal;color:var(--brass);font-weight:700}
.ds-f{font-size:14px;color:var(--ink3);margin-top:-4px}
.ds-table{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:22px;margin:14px 0 18px;min-height:130px}
.ds-slot{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:6px;animation:dsDrop .6s cubic-bezier(.3,.7,.4,1) calc(var(--i) * 70ms) both}
.ds-dl{font:700 12px/1 var(--body);color:var(--ink3)}

.die.huge{width:108px;height:108px;filter:drop-shadow(0 12px 16px rgba(0,0,0,.6))}
.die.huge .die-n{font-size:40px}
.die.huge.rolling{animation:dsShake .11s linear infinite}
.die.huge.suspense{animation:dsSusp .5s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(255,226,138,.9)) drop-shadow(0 12px 16px rgba(0,0,0,.6))}
.die.huge.landed{animation:dsLand .38s cubic-bezier(.2,1.7,.4,1)}
.die.huge.drop{opacity:.3;filter:grayscale(1);transform:scale(.8)}
.die.huge.c20{animation:dsCrit .8s cubic-bezier(.2,1.8,.4,1) both;filter:drop-shadow(0 0 26px rgba(255,215,90,.95))}
.die.huge.c20::before{background:radial-gradient(circle at 35% 28%,#fff6c8,#e8c14a 45%,#8a6a12)}
.die.huge.c1{animation:dsFum 1.3s cubic-bezier(.3,.6,.4,1) both}
.die.huge.c1::before{background:radial-gradient(circle at 35% 28%,#e8a79b,#9c3526 50%,#4a140c)}
.die.huge.c1::after{content:"";position:absolute;inset:0;clip-path:var(--shape);background:linear-gradient(115deg,transparent 32%,rgba(30,8,4,.65) 32.5% 34%,transparent 34.5%),linear-gradient(55deg,transparent 64%,rgba(30,8,4,.55) 64.5% 66%,transparent 66.5%)}
.die.huge.c1 .die-n{z-index:1}
.ds-total{font:700 92px/1 var(--display);color:var(--brass);text-shadow:0 6px 26px rgba(208,165,76,.45);min-height:92px;opacity:0;transform:scale(.4)}
.ds-total.show{opacity:1;transform:none;transition:transform .45s cubic-bezier(.2,1.7,.4,1),opacity .2s}
.dstage.crit .ds-total{color:#ffe28a;text-shadow:0 0 30px rgba(255,210,90,.95),0 0 80px rgba(255,190,60,.6)}
.dstage.fumble .ds-total{color:#e0735e}
.ds-tag{min-height:40px}

.ds-hint{font-size:12px;color:var(--ink3);opacity:.7}
.dstage.crit{background:radial-gradient(ellipse at center,rgba(90,70,20,.55),rgba(6,5,4,.85))}
.dstage.fumble{animation:dsShakeScr .55s cubic-bezier(.36,.07,.19,.97) both;background:radial-gradient(ellipse at center,rgba(10,8,6,.5),rgba(110,16,8,.8))}
.crit-fx{position:fixed;width:0;height:0;pointer-events:none;z-index:1}
.crit-rays{position:absolute;left:-280px;top:-280px;width:560px;height:560px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,215,110,.6) 0deg 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 16%,transparent 68%);mask:radial-gradient(circle,#000 16%,transparent 68%);animation:raysIn .5s ease-out both,raysSpin 5s linear infinite}
.crit-ring{position:absolute;left:-70px;top:-70px;width:140px;height:140px;border-radius:50%;border:5px solid #ffe28a;animation:ring .9s ease-out both}
.crit-ring.r2{animation-delay:.25s;border-width:3px}
.crit-fx i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;background:#ffe28a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);transform:scale(var(--s));animation:spark 1.4s cubic-bezier(.1,.8,.3,1) var(--d) both}
.fumble-skull{position:fixed;z-index:3;font-size:58px;transform:translate(-50%,-50%);pointer-events:none;animation:skull 2s ease-out both}
.dm-pre{grid-template-columns:1.2fr 1fr auto auto auto!important;padding:6px;border:1px solid var(--line);border-radius:9px;background:rgba(0,0,0,.15)}
.dm-snd{grid-column:1 / -1;display:grid;grid-template-columns:auto 1fr 58px 58px auto;gap:4px;align-items:center}
.dm-snd span{font-size:14px}
.dm-snd input{min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:13px}
@keyframes dsIn{from{opacity:0}to{opacity:1}}
@keyframes dsOut{to{opacity:0}}
@keyframes dsDrop{from{transform:translate(var(--dx),-70vh) rotate(var(--rot)) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes dsShake{0%{rotate:-9deg;translate:0 -2px}50%{rotate:9deg;translate:0 2px}100%{rotate:-9deg;translate:0 -2px}}
@keyframes dsSusp{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.12) rotate(4deg)}}
@keyframes dsLand{0%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes dsCrit{0%{transform:scale(1)}35%{transform:scale(1.6) rotate(-10deg)}65%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1.3)}}
@keyframes dsFum{0%{transform:none}20%{transform:translateY(-14px) rotate(-8deg)}55%{transform:translateY(20px) rotate(16deg) scale(.9)}100%{transform:translateY(14px) rotate(14deg) scale(.9);filter:saturate(.5) brightness(.8)}}
@keyframes dsTag{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes dsShakeScr{10%,90%{transform:translateX(-4px)}20%,80%{transform:translateX(8px)}30%,50%,70%{transform:translateX(-14px)}40%,60%{transform:translateX(14px)}}
@keyframes raysIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes raysSpin{to{rotate:360deg}}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(3.8);opacity:0}}
@keyframes spark{0%{transform:translate(0,0) scale(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(var(--s)) rotate(200deg);opacity:0}}
@keyframes skull{0%{opacity:0;transform:translate(-50%,-10%) scale(.4)}25%{opacity:1;transform:translate(-50%,-120%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-280%) scale(1)}}
@media (max-width:600px){.die.huge{width:78px;height:78px}.die.huge .die-n{font-size:28px}.ds-total{font-size:64px}}
@media (prefers-reduced-motion:reduce){.ds-slot,.die.huge,.crit-rays,.crit-ring,.crit-fx i,.fumble-skull,.dstage{animation:none!important}}

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B8720A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Comissões">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Placar de Comissões</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#EEF2EF;
    --surface:#FFFFFF;
    --surface-2:#F5F8F6;
    --ink:#142019;
    --ink-muted:#586A62;
    --border:#D8E1DB;
    --accent-pix:#B8720A;
    --accent-pix-ink:#3D2600;
    --accent-pix-soft:#FBEDD3;
    --accent-site:#0097AE;
    --accent-site-ink:#00303A;
    --accent-site-soft:#DCF2F4;
    --money:#1F8A54;
    --money-soft:#E1F3E8;
    --danger:#C4432B;
    --danger-soft:#FBE7E1;
    --shadow: 0 1px 2px rgba(20,32,25,.06), 0 8px 24px -12px rgba(20,32,25,.18);
    --radius-lg: 26px;
    --radius-md: 16px;
    --radius-sm: 10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1613;
      --surface:#172019;
      --surface-2:#1C2620;
      --ink:#ECF3EE;
      --ink-muted:#9FB3AA;
      --border:#2A3A31;
      --accent-pix:#D79A2E;
      --accent-pix-ink:#1E1300;
      --accent-pix-soft:#3A2C0F;
      --accent-site:#2FB6C2;
      --accent-site-ink:#04191D;
      --accent-site-soft:#0F2E32;
      --money:#3FCB80;
      --money-soft:#123422;
      --danger:#E4735A;
      --danger-soft:#3A1C15;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1613;
    --surface:#172019;
    --surface-2:#1C2620;
    --ink:#ECF3EE;
    --ink-muted:#9FB3AA;
    --border:#2A3A31;
    --accent-pix:#D79A2E;
    --accent-pix-ink:#1E1300;
    --accent-pix-soft:#3A2C0F;
    --accent-site:#2FB6C2;
    --accent-site-ink:#04191D;
    --accent-site-soft:#0F2E32;
    --money:#3FCB80;
    --money-soft:#123422;
    --danger:#E4735A;
    --danger-soft:#3A1C15;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:"Bricolage Grotesque", "IBM Plex Sans", sans-serif;
    text-wrap:balance;
    letter-spacing:-.01em;
  }
  .mono, .tabular{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  button:focus-visible, input:focus-visible, a:focus-visible{
    outline:2px solid var(--accent-site); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  .wrap{ max-width:640px; margin:0 auto; padding:16px 16px 48px; }
  .wrap.wide{ max-width:980px; }

  /* header */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 4px 18px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px;
    background:linear-gradient(155deg, var(--accent-pix), var(--accent-site));
    display:flex; align-items:center; justify-content:center;
    font-size:19px; box-shadow:var(--shadow);
    flex-shrink:0;
  }
  .brand-name{ font-weight:700; font-size:16px; line-height:1.15; }
  .brand-date{ font-size:12px; color:var(--ink-muted); }
  .icon-btn{
    width:40px; height:40px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-muted); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .icon-btn:hover{ color:var(--ink); background:var(--surface-2); }
  .icon-btn:active{ transform:scale(.92); }
  .icon-btn svg{ width:18px; height:18px; }

  /* streak + today strip */
  .hero{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin-bottom:16px;
  }
  .hero-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:14px 16px; box-shadow:var(--shadow);
  }
  .hero-card .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-muted); font-weight:600; }
  .hero-card .value{ font-size:28px; font-weight:700; margin-top:4px; display:flex; align-items:baseline; gap:6px; }
  .hero-card .value .unit{ font-size:13px; font-weight:600; color:var(--ink-muted); }
  .streak-flame{ font-size:22px; }
  .hero-note{ font-size:11.5px; color:var(--ink-muted); margin-top:2px; }
  .token-row{ display:flex; align-items:center; gap:5px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); }
  .token-label{ font-size:10.5px; font-weight:700; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em; margin-right:2px; }
  .token-dot{ font-size:15px; opacity:.28; filter:grayscale(1); }
  .token-dot.filled{ opacity:1; filter:none; }

  .hero-card.at-risk{ border-color:var(--accent-pix); animation:heroPulseWarn 1.6s ease-in-out infinite; }
  .hero-card.at-risk.critical{ border-color:var(--danger); animation:heroPulseCritical 1.1s ease-in-out infinite; }
  @keyframes heroPulseWarn{
    0%, 100%{ box-shadow:var(--shadow), 0 0 0 0 color-mix(in oklab, var(--accent-pix) 45%, transparent); }
    50%{ box-shadow:var(--shadow), 0 0 0 6px color-mix(in oklab, var(--accent-pix) 0%, transparent); }
  }
  @keyframes heroPulseCritical{
    0%, 100%{ box-shadow:var(--shadow), 0 0 0 0 color-mix(in oklab, var(--danger) 55%, transparent); }
    50%{ box-shadow:var(--shadow), 0 0 0 7px color-mix(in oklab, var(--danger) 0%, transparent); }
  }

  .risk-banner{
    display:flex; align-items:center; gap:10px; background:linear-gradient(155deg, var(--accent-pix-soft), var(--surface) 70%);
    border:1px solid var(--accent-pix); border-radius:var(--radius-md); padding:11px 14px; margin-bottom:12px;
    font-size:12.5px; color:var(--ink); box-shadow:var(--shadow); animation:riskBannerIn .3s ease;
  }
  .risk-banner.critical{ background:linear-gradient(155deg, var(--danger-soft), var(--surface) 70%); border-color:var(--danger); animation:riskBannerIn .3s ease, riskBannerShake 2.4s ease-in-out .3s infinite; }
  .risk-banner-icon{ font-size:19px; flex-shrink:0; }
  .risk-banner-text{ flex:1; font-weight:600; line-height:1.35; }
  .risk-banner-close{
    background:none; border:none; color:var(--ink-muted); cursor:pointer; font-size:15px; font-weight:700;
    padding:4px 6px; flex-shrink:0; border-radius:6px;
  }
  .risk-banner-close:hover{ background:rgba(0,0,0,.06); color:var(--ink); }
  @keyframes riskBannerIn{ 0%{ opacity:0; transform:translateY(-6px); } 100%{ opacity:1; transform:translateY(0); } }
  @keyframes riskBannerShake{ 0%,100%{ transform:translateX(0); } 92%{ transform:translateX(0); } 94%{ transform:translateX(-2px); } 96%{ transform:translateX(2px); } 98%{ transform:translateX(-1px); } }

  .goal-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:13px 16px; box-shadow:var(--shadow); margin-bottom:16px;
    transition:background .25s ease, border-color .25s ease;
  }
  .goal-card.met{ background:linear-gradient(155deg, var(--money-soft), var(--surface) 70%); border-color:var(--money); }
  .goal-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .goal-label{ font-size:12.5px; font-weight:700; }
  .goal-count{ font-size:12.5px; font-weight:700; color:var(--ink-muted); }
  .goal-card.met .goal-count{ color:var(--money); }
  .goal-bar{ height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
  .goal-fill{ height:100%; border-radius:999px; background:var(--accent-site); transition:width .35s cubic-bezier(.2,.7,.3,1); }
  .goal-card.met .goal-fill{ background:var(--money); }
  .goal-note{ font-size:11.5px; color:var(--ink-muted); margin-top:7px; }
  .goal-card.met .goal-note{ color:var(--money); font-weight:600; }

  .ms-section{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); }
  .ms-progress{ margin-bottom:12px; }
  .ms-progress-top{ display:flex; justify-content:space-between; align-items:baseline; font-size:11.5px; font-weight:700; color:var(--ink-muted); margin-bottom:6px; }
  .ms-progress-top .done{ color:var(--accent-pix); }
  .ms-progress-bar{ height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
  .ms-progress-fill{ height:100%; border-radius:999px; background:var(--accent-pix); transition:width .5s cubic-bezier(.2,.7,.3,1); }
  .ms-row{ display:flex; gap:8px; }
  .ms-chip{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 4px;
    border-radius:10px; background:var(--surface-2); opacity:.45; filter:grayscale(1);
    transition:opacity .25s ease, filter .25s ease;
  }
  .ms-chip.lit{ opacity:1; filter:none; background:var(--accent-pix-soft); }
  .ms-icon{ font-size:18px; }
  .ms-days{ font-size:10px; font-weight:700; color:var(--ink-muted); }
  .ms-chip.lit .ms-days{ color:var(--accent-pix); }
  .ms-reward{
    font-size:9px; font-weight:600; color:var(--ink-muted); text-align:center;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .ms-chip.lit .ms-reward{ color:var(--accent-pix); opacity:.9; }

  .reward-banner{
    display:flex; align-items:center; gap:12px; background:linear-gradient(155deg, var(--accent-pix-soft), var(--surface) 70%);
    border:1px solid var(--accent-pix); border-radius:var(--radius-md); padding:12px 16px; margin-bottom:16px;
    font-size:12.5px; color:var(--ink); box-shadow:var(--shadow);
  }
  .reward-banner svg{ width:26px; height:26px; flex-shrink:0; color:var(--accent-pix); }

  /* tap buttons */
  .tap-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
  .tap-btn{
    position:relative; border:none; cursor:pointer; text-align:left;
    border-radius:var(--radius-lg); padding:22px 18px 20px;
    min-height:150px; display:flex; flex-direction:column; justify-content:space-between;
    box-shadow:var(--shadow);
    transition:transform .12s cubic-bezier(.34,1.56,.64,1), box-shadow .12s ease;
    overflow:hidden;
    touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .tap-btn.holding{ transform:scale(.98); }
  .tap-btn.holdcomplete{ animation:holdpop .26s ease; }
  @keyframes holdpop{ 0%{ transform:scale(1); } 45%{ transform:scale(.93); } 100%{ transform:scale(1); } }
  .hold-fill{
    position:absolute; left:0; bottom:0; height:100%; width:100%; z-index:-1;
    background:rgba(255,255,255,.22); transform:scaleX(0); transform-origin:left; pointer-events:none;
  }
  .tap-btn.holding .hold-fill{ transition:transform linear; transition-duration:.6s; transform:scaleX(1); }
  .tap-btn.pix{ background:linear-gradient(160deg, var(--accent-pix) 0%, color-mix(in oklab, var(--accent-pix) 78%, black) 100%); color:var(--accent-pix-ink); }
  .tap-btn.site{ background:linear-gradient(160deg, var(--accent-site) 0%, color-mix(in oklab, var(--accent-site) 78%, black) 100%); color:var(--accent-site-ink); }
  .tap-btn .icon{ font-size:28px; }
  .tap-btn .name{ font-size:17px; font-weight:700; margin-top:10px; }
  .tap-btn .amount{ font-size:14px; font-weight:600; opacity:.85; margin-top:2px; }
  .tap-btn .count-pill{
    position:absolute; top:14px; right:14px; background:rgba(255,255,255,.35);
    border-radius:999px; padding:3px 10px; font-size:12px; font-weight:700;
  }
  .tap-btn .tap-hint{ font-size:11px; font-weight:600; opacity:.75; }

  /* ticket tape */
  .ticket{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    box-shadow:var(--shadow); overflow:hidden;
  }
  .ticket-head{
    padding:14px 18px 12px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px dashed var(--border);
  }
  .ticket-head h2{ font-size:14px; margin:0; }
  .ticket-head .total{ font-size:13px; font-weight:600; color:var(--money); }
  .ticket-perf{
    height:8px;
    background-image: radial-gradient(circle at 12px 0, var(--bg) 5px, transparent 5.5px);
    background-size: 24px 8px;
    background-position: -4px 0;
  }
  .ticket-list{ list-style:none; margin:0; padding:6px 8px 10px; max-height:340px; overflow-y:auto; }
  .ticket-row{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px;
  }
  .ticket-row:hover{ background:var(--surface-2); }
  .ticket-chip{
    font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:6px; letter-spacing:.03em;
  }
  .ticket-chip.pix{ background:var(--accent-pix-soft); color:var(--accent-pix); }
  .ticket-chip.site{ background:var(--accent-site-soft); color:var(--accent-site); }
  .ticket-time{ font-size:12px; color:var(--ink-muted); }
  .ticket-amount{ margin-left:auto; font-size:13.5px; font-weight:700; color:var(--money); }
  .ticket-del{
    width:24px; height:24px; border-radius:7px; border:none; background:none; color:var(--ink-muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .ticket-del:hover{ background:var(--danger-soft); color:var(--danger); }
  .ticket-del svg{ width:13px; height:13px; }
  .empty-note{ text-align:center; padding:28px 10px 22px; color:var(--ink-muted); font-size:13px; }
  .empty-note .big{ font-size:26px; display:block; margin-bottom:6px; }

  .footnote{ text-align:center; font-size:11.5px; color:var(--ink-muted); margin-top:16px; }
  .footnote button{ background:none; border:none; color:var(--ink-muted); text-decoration:underline; cursor:pointer; font-size:inherit; padding:0; }

  /* --- admin --- */
  .admin-topbar{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .back-btn{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer;
  }
  .back-btn:hover{ background:var(--surface-2); }
  .admin-title{ font-size:18px; font-weight:700; }

  .kpi-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .kpi{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:14px 14px; box-shadow:var(--shadow);
  }
  .kpi .label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); font-weight:600; }
  .kpi .value{ font-size:22px; font-weight:700; margin-top:4px; }
  .kpi .sub{ font-size:11.5px; color:var(--ink-muted); margin-top:3px; }

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:18px; box-shadow:var(--shadow); margin-bottom:16px;
  }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
  .panel-head h3{ font-size:14.5px; margin:0; }
  .legend{ display:flex; gap:14px; font-size:12px; color:var(--ink-muted); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:9px; height:9px; border-radius:3px; display:inline-block; }
  .legend i.pix{ background:var(--accent-pix); }
  .legend i.site{ background:var(--accent-site); }

  .chart-scroll{ overflow-x:auto; }
  .chart-svg text{ fill:var(--ink-muted); }

  .day-goal-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(64px,1fr)); gap:8px; }
  .day-chip{
    border-radius:11px; padding:8px 6px; text-align:center; display:flex; flex-direction:column; gap:3px;
    border:1px solid var(--border); background:var(--surface-2);
  }
  .day-chip.met{ background:var(--money-soft); border-color:var(--money); }
  .day-chip.miss{ background:var(--danger-soft); border-color:var(--danger); }
  .day-chip.weekend{ background:var(--surface-2); border-color:var(--border); opacity:.6; }
  .day-chip.token{ background:var(--accent-site-soft); border-color:var(--accent-site); }
  .day-chip.today{ box-shadow:0 0 0 2px var(--accent-site) inset; }
  .day-chip-date{ font-size:10.5px; font-weight:600; color:var(--ink-muted); font-family:"IBM Plex Mono",monospace; }
  .day-chip-icon{ font-size:14px; }
  .day-chip-count{ font-size:11px; font-weight:700; font-family:"IBM Plex Mono",monospace; }
  .day-chip.met .day-chip-count{ color:var(--money); }
  .day-chip.miss .day-chip-count{ color:var(--danger); }
  .day-chip.weekend .day-chip-count{ color:var(--ink-muted); }
  .day-chip.token .day-chip-count{ color:var(--accent-site); }

  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink-muted);
    font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .chip.active{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
  :root[data-theme="dark"] .chip.active, .chip.active{ background:var(--accent-site); border-color:var(--accent-site); color:var(--accent-site-ink); }

  .table-scroll{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:480px; }
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted);
    font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border);
  }
  tbody td{ padding:9px 10px; border-bottom:1px solid var(--border); }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface-2); }
  td.amount{ font-weight:700; color:var(--money); }
  .row-del{ background:none; border:none; color:var(--ink-muted); cursor:pointer; padding:4px; border-radius:6px; display:flex; }
  .row-del:hover{ color:var(--danger); background:var(--danger-soft); }
  .row-del svg{ width:14px; height:14px; }

  .btn{
    display:inline-flex; align-items:center; gap:7px; border-radius:10px; padding:9px 15px;
    font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--surface);
    color:var(--ink);
  }
  .btn:hover{ background:var(--surface-2); }
  .btn.primary{ background:var(--money); border-color:var(--money); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn svg{ width:14px; height:14px; }

  .settings-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink-muted); }
  .field input{
    border:1px solid var(--border); background:var(--bg); color:var(--ink); border-radius:9px;
    padding:9px 11px; font-size:14px; font-family:"IBM Plex Mono", monospace;
  }
  .field input:focus{ border-color:var(--accent-site); }
  .milestone-settings{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .milestone-row{ display:grid; grid-template-columns:80px 1fr; gap:8px; }
  .milestone-row input{
    border:1px solid var(--border); background:var(--bg); color:var(--ink); border-radius:9px;
    padding:9px 11px; font-size:13.5px; font-family:"IBM Plex Mono", monospace;
  }
  .milestone-row input:focus{ border-color:var(--accent-pix); }
  .checkbox-label{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-muted); cursor:pointer; }
  .checkbox-label input{ width:auto; }
  .settings-locked{ padding:10px 2px 4px; }
  .settings-locked-note{ font-size:12.5px; color:var(--ink-muted); margin:0 0 10px; }
  .settings-locked input{
    border:1px solid var(--border); background:var(--bg); color:var(--ink); border-radius:9px;

  };


  function num(v, dflt){ return (typeof v === "number" && isFinite(v)) ? v : dflt; }

  function normalizeMilestones(arr){
    if (!Array.isArray(arr) || !arr.length) return DEFAULT_MILESTONES;
    var out = arr.filter(function(m){ return m && typeof m.days==="number" && m.days>0; })
      .map(function(m){ return { days: Math.floor(m.days) }; })
      .sort(function(a,b){ return a.days-b.days; });
    return out.length ? out : DEFAULT_MILESTONES;
  }

  function normalizeForgivenDays(arr){
    if (!Array.isArray(arr)) return [];
    return arr.filter(function(d){ return typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d); });
  }

  // feriados: tratados igual domingo (meta opcional, bate = +2 dias de bônus na sequência)
  function normalizeHolidays(arr){
    if (!Array.isArray(arr)) return [];
    return arr.filter(function(d){ return typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d); });
  }

  function cloneTiers(t){ return t.map(function(x){ return { from:x.from, site:x.site, pix:x.pix }; }); }

  function normalizeTiers(arr){
    if (!Array.isArray(arr) || !arr.length) return cloneTiers(DEFAULT_TIERS);
    var out = arr.filter(function(t){ return t && typeof t.from === "number" && t.from >= 1; })
      .map(function(t){ return { from: Math.floor(t.from), site: Math.max(0, num(t.site, 0)), pix: Math.max(0, num(t.pix, 0)) }; })
      .sort(function(a,b){ return a.from-b.from; });
    if (!out.length || out[0].from !== 1) return cloneTiers(DEFAULT_TIERS);
    return out;
  }

  // histórico da tabela de degraus: mudar os valores vale do dia da mudança em diante
  function normalizeTiersHistory(arr, fallbackTiers){
    var out = [];
    if (Array.isArray(arr)){
      out = arr.filter(function(h){ return h && typeof h.from === "string" && /^\d{4}-\d{2}-\d{2}$/.test(h.from); })
        .map(function(h){ return { from: h.from, tiers: normalizeTiers(h.tiers) }; })
        .sort(function(a,b){ return a.from < b.from ? -1 : (a.from > b.from ? 1 : 0); });
    }
    if (!out.length) out = [{ from: TIERS_START_DATE, tiers: normalizeTiers(fallbackTiers) }];
    return out;
  }

  function normalizeAttendants(arr){
    if (!Array.isArray(arr)) return DEFAULT_ATTENDANTS.slice();
    var seen = {}, out = [];
    arr.forEach(function(n){
      if (typeof n !== "string") return;
      n = n.trim();
      if (n && !seen[n.toLowerCase()]){ seen[n.toLowerCase()] = true; out.push(n); }
    });
    return out.length ? out : DEFAULT_ATTENDANTS.slice();
  }

  function normalizePaidMap(m){
    var out = {};
    if (m && typeof m === "object") Object.keys(m).forEach(function(k){ if (typeof m[k] === "number") out[k] = m[k]; });
    return out;
  }

  function normalizeAuth(a){
    return (a && typeof a === "object" && typeof a.hash === "string" && typeof a.salt === "string") ? { salt: a.salt, hash: a.hash } : null;
  }
  // logins dos atendentes: { "Emily": { user:"emily", salt, hash } }
  function normalizeAccounts(m){
    var out = {};
    if (m && typeof m === "object") Object.keys(m).forEach(function(k){
      var a = m[k];
      if (!a || typeof a !== "object") return;
      out[k] = { user: typeof a.user === "string" ? a.user : normLogin(k), salt: typeof a.salt === "string" ? a.salt : "", hash: typeof a.hash === "string" ? a.hash : "" };
    });
    return out;
  }

  function readConfig(d){
    d = d || {};
    var hist = normalizeTiersHistory(d.tiersHistory, d.tiers);
    return {
      pixValue: num(d.pixValue, 10),
      siteValue: num(d.siteValue, 5),
      paidUntilTs: num(d.paidUntilTs, 0),
      siteGoal: num(d.siteGoal, 3),
      milestones: normalizeMilestones(d.milestones),
      settingsPin: typeof d.settingsPin === "string" ? d.settingsPin : "",
      forgivenDays: normalizeForgivenDays(d.forgivenDays),
      holidays: normalizeHolidays(d.holidays),
      tiersHistory: hist,
      tiers: hist[hist.length-1].tiers,
      attendants: normalizeAttendants(d.attendants),
      paidUntilByAttendant: normalizePaidMap(d.paidUntilByAttendant),
      migrationV2: d.migrationV2 === true,
      accounts: normalizeAccounts(d.accounts),
      adminAuth: normalizeAuth(d.adminAuth)
    };
  }

  function mapDocs(snap){ return snap.docs.map(function(d){ var v = d.data(); v.id = d.id; return v; }); }

  /* ---------- db init ---------- */
  // Realtime listeners (onSnapshot) are the primary sync path, but every
  // action in this app already updates local state optimistically.
  // loadInitial() is a plain one-time read, used as a safety net for the
  // FIRST load (and for manual refresh).
  async function loadInitial(){
    if (!state.db) return;
    try {
      var cfgSnap = await state.db.doc("config/settings").get();
      if (cfgSnap.exists){ state.config = readConfig(cfgSnap.data()); state.configLoaded = true; }
    } catch(e){ console.error("[placar] initial config load failed", e); }
    try {
      var salesSnap = await state.db.collection("sales").orderBy("ts","desc").limit(800).get();
      state.sales = mapDocs(salesSnap);
    } catch(e){ console.error("[placar] initial sales load failed", e); }
    try {
      var poSnap = await state.db.collection("payouts").orderBy("paidAt","desc").limit(200).get();
      state.payouts = mapDocs(poSnap);
    } catch(e){ console.error("[placar] initial payouts load failed", e); }
    try {
      var adjSnap = await state.db.collection("adjustments").orderBy("createdAt","desc").limit(300).get();
      state.adjustments = mapDocs(adjSnap);
    } catch(e){ console.error("[placar] initial adjustments load failed", e); }
    state.dbReady = true;
    render();
    maybeMigrateV2();
  }

  // Migração única da versão 2 (roda no primeiro aparelho que abrir o site novo):
  // meta da sequência = 3, tabela de degraus, lista de atendentes, "pago até" por
  // atendente, e o lançamento combinado de R$200 pra Emily. Não apaga nada.
  var migrating = false;
  async function maybeMigrateV2(){
    if (!state.db || !state.configLoaded || state.config.migrationV2 || migrating) return;
    migrating = true;
    try {
      var snap = await state.db.doc("config/settings").get();
      var d = snap.exists ? snap.data() : {};
      if (d.migrationV2 === true){ state.config = readConfig(d); migrating = false; render(); return; }
      var now = Date.now();
      var legacyPaid = num(d.paidUntilTs, 0);
      var paidMap = normalizePaidMap(d.paidUntilByAttendant);
      DEFAULT_ATTENDANTS.forEach(function(a){ if (typeof paidMap[a] !== "number") paidMap[a] = legacyPaid; });
      var patch = { siteGoal: 3, paidUntilByAttendant: paidMap, migrationV2: true, migrationV2At: now, updatedAt: now };
      if (!Array.isArray(d.tiersHistory) || !d.tiersHistory.length){
        patch.tiersHistory = [{ from: TIERS_START_DATE, tiers: cloneTiers(DEFAULT_TIERS) }];
        patch.tiers = cloneTiers(DEFAULT_TIERS);
      }
      if (!Array.isArray(d.attendants) || !d.attendants.length) patch.attendants = DEFAULT_ATTENDANTS.slice();

      var adjRef = state.db.doc("adjustments/"+MIGRATION_ADJ_ID);
      var adjSnap = await adjRef.get();
      if (!adjSnap.exists){
        var adj = { attendant:"Emily", amount:200, description:"Prêmio 30 dias (liberado pelo gestor)", createdAt: now, source:"gestor" };
        await adjRef.set(adj);
        if (!state.adjustments.some(function(a){ return a.id === MIGRATION_ADJ_ID; })){
          var local = { id: MIGRATION_ADJ_ID }; for (var k in adj) local[k] = adj[k];
          state.adjustments.unshift(local);
        }
      }
      if (snap.exists) await state.db.doc("config/settings").update(patch);
      else await state.db.doc("config/settings").set(Object.assign({ pixValue:10, siteValue:5, paidUntilTs:0, milestones:DEFAULT_MILESTONES, settingsPin:"", forgivenDays:[], holidays:[] }, patch));
      state.config = readConfig(Object.assign({}, d, patch));
    } catch(e){ console.error("[placar] migração v2 falhou (tenta de novo na próxima abertura)", e); }
    migrating = false;
    render();
  }

  /* ---------- Firebase (substitui o window.claude.use("db") do artifact) ---------- */
  function makeDbShim(fb, fsDb){
    function wrapDocSnap(snap){
      return { exists: snap.exists(), id: snap.id, data: function(){ return snap.data(); } };
    }
    function wrapQuerySnap(qs){
      return { docs: qs.docs.map(function(d){ return { id: d.id, data: function(){ return d.data(); } }; }) };
    }
    function docRef(path){
      var ref = fb.doc(fsDb, path);
      return {
        get: function(){ return fb.getDoc(ref).then(wrapDocSnap); },
        set: function(data){ return fb.setDoc(ref, data); },
        update: function(data){ return fb.updateDoc(ref, data); },
        delete: function(){ return fb.deleteDoc(ref); },
        onSnapshot: function(cb, errCb){ return fb.onSnapshot(ref, function(snap){ cb(wrapDocSnap(snap)); }, errCb); }
      };
    }
    function collRef(path){
      var base = fb.collection(fsDb, path);
      var constraints = [];
      var api = {
        add: function(data){ return fb.addDoc(base, data).then(function(ref){ return { id: ref.id }; }); },
        doc: function(id){ return docRef(path+"/"+id); },
        orderBy: function(field, dir){ constraints.push(fb.orderBy(field, dir||"asc")); return api; },
        limit: function(n){ constraints.push(fb.limit(n)); return api; },
        get: function(){
          var q = constraints.length ? fb.query.apply(null, [base].concat(constraints)) : base;
          return fb.getDocs(q).then(wrapQuerySnap);
        },
        onSnapshot: function(cb, errCb){
          var q = constraints.length ? fb.query.apply(null, [base].concat(constraints)) : base;
          return fb.onSnapshot(q, function(qs){ cb(wrapQuerySnap(qs)); }, errCb);
        }
      };
      return api;
    }
    return { doc: docRef, collection: collRef };
  }

  function waitForFirebaseSdk(){
    return new Promise(function(resolve){
      if (window.__fb) return resolve(window.__fb);
      window.addEventListener("fbready", function(){ resolve(window.__fb); }, { once:true });
      setTimeout(function(){ resolve(window.__fb || null); }, 8000); // timeout so we don't hang forever if the CDN failed
    });
  }

  async function connectFirebase(){
    var fb = await waitForFirebaseSdk();
    if (!fb) return null;
    if (!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey || window.FIREBASE_CONFIG.apiKey.indexOf("COLE_") === 0){
      console.error("[placar] preencha o firebase-config.js com as chaves do seu projeto Firebase");
      return null;
    }
    var app = fb.initializeApp(window.FIREBASE_CONFIG);
    var auth = fb.getAuth(app);
    await fb.signInAnonymously(auth);
    var fsDb = fb.getFirestore(app);
    return makeDbShim(fb, fsDb);
  }


  async function initDb(){
    var db = null;
    try { db = await connectFirebase(); } catch(e){ console.error("[placar] firebase init failed", e); db = null; }
    state.db = db;
    if (!db){ state.dbReady = true; render(); return; }

    await loadInitial();

    db.doc("config/settings").onSnapshot(function(snap){
      if (snap.exists){
        state.config = readConfig(snap.data());
        state.configLoaded = true;
        maybeMigrateV2();
      } else {
        state.configLoaded = true;
        db.doc("config/settings").set({ pixValue:10, siteValue:5, paidUntilTs:0, siteGoal:3, milestones:DEFAULT_MILESTONES, settingsPin:"", forgivenDays:[], holidays:[], updatedAt: Date.now() }).catch(function(e){ console.error("[placar] seed config failed", e); });
      }
      render();
    }, function(e){ console.error("[placar] config listener error", e); state.dbError = true; render(); });

    db.collection("sales").orderBy("ts","desc").limit(800).onSnapshot(function(snap){
      var docs = mapDocs(snap);
      notifyRemoteSales(docs);
      state.sales = docs;
      state.dbReady = true;
      render();
    }, function(e){ console.error("[placar] sales listener error", e); state.dbError = true; state.dbReady = true; render(); });

    db.collection("payouts").orderBy("paidAt","desc").limit(200).onSnapshot(function(snap){
      state.payouts = mapDocs(snap);
      render();
    }, function(e){ console.error("[placar] payouts listener error", e); });

    db.collection("adjustments").orderBy("createdAt","desc").limit(300).onSnapshot(function(snap){
      state.adjustments = mapDocs(snap);
      render();
    }, function(e){ console.error("[placar] adjustments listener error", e); });
  }

  // avisa (texto + som) quando chega venda nova marcada em OUTRO aparelho/extensão
  function notifyRemoteSales(docs){
    if (!state.seenSaleIds){
      state.seenSaleIds = {};
      state.sales.concat(docs).forEach(function(s){ state.seenSaleIds[s.id] = true; });
      return;
    }
    var now = Date.now();
    var fresh = docs.filter(function(s){
      return !state.seenSaleIds[s.id] && !state.localSaleIds[s.id] && (now - (s.ts||0)) < 10*60*1000;
    });
    docs.forEach(function(s){ state.seenSaleIds[s.id] = true; });
    if (!fresh.length) return;
    var cm = commissionMap(docs);
    var msg = fresh.length === 1
      ? saleMessage(fresh[0], commissionOf(fresh[0], cm))
      : fresh.length + " vendas novas — " + fresh.map(function(s){ return attOf(s) + " " + brlShort(commissionOf(s, cm)); }).join(", ");
    showSnackbar("🔔 " + msg, false);
    chime(fresh[0].type);
  }

  function saleMessage(s, value){
    return attOf(s) + " vendeu no " + (s.type === "PIX" ? "Pix" : "site") + " — " + brlShort(value);
  }

  /* ---------- derived data ---------- */
  function attOf(s){ return (s && typeof s.attendant === "string" && s.attendant) ? s.attendant : LEGACY_ATTENDANT; }
  function attendants(){ var a = state.config.attendants; return (a && a.length) ? a : DEFAULT_ATTENDANTS; }
  // lista do gestor + qualquer nome que ainda tenha venda/ajuste (ex.: removido da lista depois)
  function allAttendantsSeen(){
    var list = attendants().slice(), seen = {};
    list.forEach(function(n){ seen[n] = true; });
    state.sales.forEach(function(s){ var a = attOf(s); if (!seen[a]){ seen[a] = true; list.push(a); } });
    state.adjustments.forEach(function(x){ var a = x.attendant || LEGACY_ATTENDANT; if (!seen[a]){ seen[a] = true; list.push(a); } });
    return list;
  }

  function isTierSale(s){ return (s.dateStr || "") >= TIERS_START_DATE; }

  function tiersFor(dateStr){
    var hist = state.config.tiersHistory || [], cur = null;
    for (var i=0;i<hist.length;i++){ if (hist[i].from <= dateStr) cur = hist[i].tiers; }
    return cur || (hist.length ? hist[0].tiers : DEFAULT_TIERS);
  }

  function tierFor(pos, dateStr){
    var t = tiersFor(dateStr), cur = t[0];
    for (var i=0;i<t.length;i++){ if (t[i].from <= pos) cur = t[i]; }
    return cur;
  }

  function tierValue(pos, type, dateStr){
    var t = tierFor(pos, dateStr || todayStr());
    return type === "PIX" ? t.pix : t.site;
  }

  // valor de cada venda: vendas antigas = valor gravado; da escadinha = posição do
  // dia (por atendente, site + Pix juntos, em ordem de horário) -> degrau
  function commissionMap(sales){
    sales = sales || state.sales;
    var map = {}, groups = {};
    sales.forEach(function(s){
      if (!isTierSale(s)){ map[s.id] = { value: Number(s.commission) || 0, pos: null }; return; }
      var k = attOf(s) + "|" + s.dateStr;
      (groups[k] = groups[k] || []).push(s);
    });
    Object.keys(groups).forEach(function(k){
      groups[k].sort(function(a,b){ return ((a.ts||0) - (b.ts||0)) || (String(a.id) < String(b.id) ? -1 : 1); })
        .forEach(function(s, i){ map[s.id] = { value: tierValue(i+1, s.type, s.dateStr), pos: i+1 }; });
    });
    return map;
  }

  function commissionOf(s, cm){ var e = (cm || commissionMap())[s.id]; return e ? e.value : (Number(s.commission) || 0); }
  function positionOf(s, cm){ var e = (cm || commissionMap())[s.id]; return e ? e.pos : null; }
  function sumCommission(arr, cm){ cm = cm || commissionMap(); return arr.reduce(function(a,s){ return a + commissionOf(s, cm); }, 0); }
  function salesOf(att, arr){ return (arr || state.sales).filter(function(s){ return attOf(s) === att; }); }
  function todaySalesOf(att){ var t = todayStr(); return state.sales.filter(function(s){ return s.dateStr === t && attOf(s) === att; }); }
  function nextValuesFor(att){
    var pos = todaySalesOf(att).length + 1, t = todayStr();
    return { pos: pos, site: tierValue(pos, "SITE", t), pix: tierValue(pos, "PIX", t) };
  }

  function paidUntilFor(att){
    var m = state.config.paidUntilByAttendant || {};
    return typeof m[att] === "number" ? m[att] : (state.config.paidUntilTs || 0);
  }

  function pendingFor(att, cm){
    cm = cm || commissionMap();
    var paid = paidUntilFor(att);
    var sales = state.sales.filter(function(s){ return attOf(s) === att && (s.ts||0) > paid; });
    var adjs = state.adjustments.filter(function(a){ return (a.attendant || LEGACY_ATTENDANT) === att && (a.createdAt||0) > paid; });
    var salesTotal = sumCommission(sales, cm);
    var adjTotal = adjs.reduce(function(x,a){ return x + (Number(a.amount) || 0); }, 0);
    return { sales: sales, adjustments: adjs, salesTotal: salesTotal, adjTotal: adjTotal, total: salesTotal + adjTotal, paidUntil: paid };
  }

  function siteGoal(){ return state.config.siteGoal || 3; }
  // meta da sequência de cada dia (dias antes da atualização usavam 2)
  function goalFor(dateStr){ return dateStr < TIERS_START_DATE ? LEGACY_GOAL : siteGoal(); }

  function countsByDay(att){
    var m = {};
    state.sales.forEach(function(s){ if (attOf(s) === att) m[s.dateStr] = (m[s.dateStr]||0) + 1; });
    return m;
  }

  var WEEKDAY_IDX = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
  function weekStartStr(){
    var idx = WEEKDAY_IDX[weekdayShort(new Date())];
    return dstr(addDays(new Date(), -((idx + 6) % 7))); // segunda-feira desta semana
  }

  // sábado: meta é opcional — se bater mesmo assim, ganha +1 dia de bônus na
  // sequência; se não bater, sem problema (não quebra, não conta contra).
  // domingo e feriados: mesma regra, mas o bônus é +2 dias (contam em dobro).
  function weekdayShort(d){ return new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short"}).format(d); }
  function isWeekendDate(d){ var wd = weekdayShort(d); return wd==="Sat" || wd==="Sun"; }
  // 0 = dia útil normal (meta obrigatória) · 1 = sábado (bônus opcional) · 2 = domingo/feriado (bônus opcional, dobrado)
  function bonusMultFor(d, ds, holidaySet){
    var wd = weekdayShort(d);
    if (wd === "Sat") return 1;
    if (wd === "Sun") return 2;
    if (holidaySet[ds]) return 2;
    return 0;
  }

  var FREEZE_TOKEN_CAP = 2;        // máximo de fichas de congelamento guardadas ao mesmo tempo
  var FREEZE_TOKEN_MULT = 2;       // vender esse tanto (ou mais) da meta num dia dá 1 ficha

  // Sequência (streak) de UM atendente — só gamificação visual, sem dinheiro.
  // Simula dia a dia: dias úteis têm meta obrigatória; sábado/domingo/feriado são
  // bônus opcionais; dias perdoados manualmente são pulados. Status de dia fechado:
  //   met / pending / recovered / token / broken / forgiven / weekend / holiday
  function computeStreakState(att){
    var counts = countsByDay(att);
    var forgivenSet = {};
    (state.config.forgivenDays || []).forEach(function(d){ forgivenSet[d] = true; });
    var holidaySet = {};
    (state.config.holidays || []).forEach(function(d){ holidaySet[d] = true; });

    var todayD = todayStr();
    var closedDates = Object.keys(counts).filter(function(d){ return d < todayD; });
    var firstDate = closedDates.length ? closedDates.sort()[0] : null;

    var streakCount = 0, tokens = 0, pendingDate = null;
    var dayLog = {};

    if (firstDate){
      var cursor = new Date(firstDate + "T12:00:00-03:00");
      var yesterdayDate = addDays(new Date(todayD+"T12:00:00-03:00"), -1);
      while (cursor.getTime() <= yesterdayDate.getTime()){
        var ds = dstr(cursor);
        var goal = goalFor(ds);
        var bonusMult = bonusMultFor(cursor, ds, holidaySet);
        var c = counts[ds] || 0;
        if (bonusMult > 0){
          if (c >= goal){
            if (pendingDate){ dayLog[pendingDate] = "recovered"; pendingDate = null; }
            streakCount += bonusMult;
            dayLog[ds] = "met";
            if (c >= goal * FREEZE_TOKEN_MULT) tokens = Math.min(FREEZE_TOKEN_CAP, tokens+1);
          } else {
            dayLog[ds] = isWeekendDate(cursor) ? "weekend" : "holiday";
          }
        } else if (forgivenSet[ds]){
          dayLog[ds] = "forgiven";
        } else {
          if (c >= goal){
            if (pendingDate){ dayLog[pendingDate] = "recovered"; pendingDate = null; }
            streakCount += 1;
            dayLog[ds] = "met";
            if (c >= goal * FREEZE_TOKEN_MULT) tokens = Math.min(FREEZE_TOKEN_CAP, tokens+1);
          } else {
            if (pendingDate){
              if (tokens > 0){ tokens -= 1; dayLog[pendingDate] = "token"; }
              else { streakCount = 0; dayLog[pendingDate] = "broken"; }
            }
            pendingDate = ds;
            dayLog[ds] = "pending";
          }
        }
        cursor = addDays(cursor, 1);
      }
    }

    // hoje (dia em andamento): só exibição — sem gastar ficha nem declarar quebra
    var pendingFromYesterday = !!pendingDate;
    var todayDate = new Date(todayD+"T12:00:00-03:00");
    var todayBonusMult = bonusMultFor(todayDate, todayD, holidaySet);
    var todayCount = counts[todayD] || 0;
    var todayMet = !!forgivenSet[todayD] || todayCount >= goalFor(todayD);

    var displayCount = streakCount;
    var needsToday = false, recovering = false;

    if (todayBonusMult > 0){
      if (todayMet){
        displayCount = streakCount + todayBonusMult;
        if (pendingFromYesterday) dayLog[pendingDate] = "recovered";
      }
    } else if (todayMet){
      displayCount = streakCount + 1;
      if (pendingFromYesterday) dayLog[pendingDate] = "recovered";
    } else {
      needsToday = true;
      recovering = pendingFromYesterday;
    }

    return {
      count: displayCount,
      preTodayCount: streakCount,
      needsToday: needsToday,
      recovering: recovering,
      willBreakToday: recovering && tokens<=0,
      tokens: tokens,
      todayBonusMult: todayBonusMult,
      dayLog: dayLog
    };
  }

  }

  /* ---------- hold-to-confirm (avoids marking a sale by accident) ---------- */
  var HOLD_MS = 600;
  var holdTimers = {}; // type -> timeout id, while a press is in progress

  function wireHoldButton(type){
    var btn = document.getElementById(type==="PIX"?"btn-pix":"btn-site");
    if (!btn) return;

    function start(e){
      if (e.cancelable) e.preventDefault();
      if (holdTimers[type]) return; // already holding (avoid double pointers)
      btn.classList.add("holding");
      holdTimers[type] = setTimeout(function(){
        holdTimers[type] = null;
        btn.classList.remove("holding");
        btn.classList.add("holdcomplete");
        setTimeout(function(){ btn.classList.remove("holdcomplete"); }, 260);
        var next = nextValuesFor(state.me);
        var val = type==="PIX" ? next.pix : next.site;
        askLeadInfo(type, val).then(function(lead){
          if (lead) registerSale(type, lead);
        });
      }, HOLD_MS);
    }
    function cancel(){
      if (holdTimers[type]){
        clearTimeout(holdTimers[type]);
        holdTimers[type] = null;
      }
      btn.classList.remove("holding");
    }

    btn.addEventListener("pointerdown", start);
    btn.addEventListener("pointerup", cancel);
    btn.addEventListener("pointercancel", cancel);
    btn.addEventListener("pointerleave", cancel);
    btn.addEventListener("contextmenu", function(e){ e.preventDefault(); });
    btn.addEventListener("keydown", function(e){
      if ((e.key==="Enter" || e.key===" ") && !e.repeat) start(e);
    });
    btn.addEventListener("keyup", function(e){
      if (e.key==="Enter" || e.key===" ") cancel();
    });
    btn.addEventListener("blur", cancel);
  }

  // label de um degrau: "1ª e 2ª", "3ª", "5ª+"
  function tierLabel(t, i, short){
    var to = i+1 < t.length ? t[i+1].from - 1 : null;
    if (to === null) return t[i].from + (short ? "ª+" : "ª em diante");
    if (to === t[i].from) return t[i].from + "ª";
    if (to === t[i].from + 1) return t[i].from + "ª e " + to + "ª";
    return t[i].from + "ª a " + to + "ª";
  }

  function ladderStepsHtml(nextPos, dateStr){
    var t = tiersFor(dateStr);
    return t.map(function(tier, i){
      var to = i+1 < t.length ? t[i+1].from - 1 : null;
      var cls = (to !== null && to < nextPos) ? " done" : ((nextPos >= tier.from && (to === null || nextPos <= to)) ? " current" : "");
      return '<div class="ladder-step'+cls+'"><div class="n">'+tierLabel(t, i, true)+'</div><div class="v"><span class="s">'+brlShort(tier.site)+'</span> · <span class="p">'+brlShort(tier.pix)+'</span></div></div>';
    }).join("");
  }

  function ladderNote(nextPos, dateStr){
    var t = tiersFor(dateStr), upcoming = null;
    for (var i=0;i<t.length;i++){ if (t[i].from > nextPos){ upcoming = t[i]; break; } }
    if (!upcoming){
      var top = t[t.length-1];
      return "Você está no degrau máximo — cada venda vale "+brlShort(top.site)+" no site / "+brlShort(top.pix)+" no Pix 🔥";
    }
    var d = upcoming.from - nextPos;
    return "Mais "+d+" venda"+plural(d,"","s")+" e cada venda passa a valer "+brlShort(upcoming.site)+" no site / "+brlShort(upcoming.pix)+" no Pix 🚀";
  }

  function filteredAdminSales(){
    var r = state.adminFilterRange, t = state.adminFilterType, fa = state.adminFilterAtt;

    else if (r === "7") cutoff = dstr(addDays(new Date(),-6));

    else if (r === "month") cutoff = monthStr()+"-01";
    return state.sales.filter(function(s){
      if (cutoff && s.dateStr < cutoff) return false;
      if (t !== "all" && s.type !== t) return false;
      if (fa !== "all" && attOf(s) !== fa) return false;
      return true;
    });
  }

  function last14Days(){
    var out = [];
    for (var i=13;i>=0;i--) out.push(dstr(addDays(new Date(),-i)));
    return out;
  }

  function renderChart(list, cm){
    var days = last14Days();
    var byDay = {};
    days.forEach(function(d){ byDay[d]={PIX:0,SITE:0}; });
    list.forEach(function(s){
      if (byDay[s.dateStr]) byDay[s.dateStr][s.type] += commissionOf(s, cm);
    });
    var max = 1;
    days.forEach(function(d){ max = Math.max(max, byDay[d].PIX + byDay[d].SITE); });
    max = Math.ceil(max/10)*10 || 10;

    var W = 640, H = 200, padL = 42, padB = 26, padT = 12, padR = 8;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var bw = plotW / days.length;
    var barW = Math.min(26, bw*0.56);

    function y(v){ return padT + plotH - (v/max)*plotH; }

    var bars = "", labels = "";
    days.forEach(function(d, i){
      var cx = padL + bw*i + bw/2;
      var pix = byDay[d].PIX, site = byDay[d].SITE;
      var yPix = y(pix), ySiteTop = y(pix+site);
      if (pix>0){
        bars += '<rect x="'+(cx-barW/2)+'" y="'+yPix+'" width="'+barW+'" height="'+(y(0)-yPix)+'" rx="4" fill="var(--accent-pix)"/>';
      }
      if (site>0){
        var h2 = (pix>0? (yPix - ySiteTop) : (y(0)-ySiteTop));
        bars += '<rect x="'+(cx-barW/2)+'" y="'+ySiteTop+'" width="'+barW+'" height="'+Math.max(h2,0)+'" rx="4" fill="var(--accent-site)"/>';
      }
      if (i%2===0 || days.length<=7){
        labels += '<text x="'+cx+'" y="'+(H-8)+'" font-size="10" text-anchor="middle">'+fmtDay(d)+'</text>';
      }
    });

    var gridLines = "";
    var steps = 4;
    for (var g=0; g<=steps; g++){
      var v = max*g/steps;
      var gy = y(v);
      gridLines += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--border)" stroke-width="1"/>';
      gridLines += '<text x="'+(padL-6)+'" y="'+(gy+3)+'" font-size="10" text-anchor="end">'+Math.round(v)+'</text>';
    }

    return '<div class="chart-scroll"><svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" width="100%" height="200" role="img" aria-label="Comissão diária, últimos 14 dias">'
      + gridLines + bars + labels + '</svg></div>';
  }

  // grade dos últimos 14 dias da meta da sequência, de um atendente
  function goalGrid(att){
    var counts = countsByDay(att);
    var streak = computeStreakState(att);
    var today = todayStr();
    var holidaySet = {};
    (state.config.holidays || []).forEach(function(h){ holidaySet[h] = true; });
    var met = 0, relevant = 0;
    var DAY_STATUS_META = {
      met:      { cls:"met",     icon:"✅" },
      recovered:{ cls:"token",   icon:"🧊" },
      token:    { cls:"token",   icon:"🧊" },
      forgiven: { cls:"token",   icon:"🛡️" },
      broken:   { cls:"miss",    icon:"❌" },
      pending:  { cls:"miss",    icon:"⚠️" }
    };
    var html = last14Days().map(function(d){
      var wd = weekdayShort(new Date(d+"T12:00:00-03:00"));
      var isSat = wd === "Sat", isSun = wd === "Sun";
      var isHoliday = !isSat && !isSun && !!holidaySet[d];
      var bonusDay = isSat || isSun || !!holidaySet[d];
      var bonusMult = isSat ? 1 : (bonusDay ? 2 : 0);
      var goal = goalFor(d);
      var c = counts[d] || 0;
      var isToday = d === today;
      var dayMet = c >= goal;
      if (!bonusDay){ relevant++; if (dayMet) met++; }
      var bonusLabel = isSat ? "Sábado" : (isSun ? "Domingo" : "Feriado");

      var stateClass, icon, countLabel, titleAttr = "";
      if (bonusDay){
        if (dayMet){
          stateClass = "met"; icon = "⭐"; countLabel = c+"/"+goal;
          titleAttr = bonusLabel+" — bateu a meta, +"+bonusMult+" dia"+(bonusMult===1?"":"s")+" de bônus na sequência";
        } else {
          stateClass = "weekend"; icon = isHoliday ? "🎉" : "🌴"; countLabel = "opcional";
          titleAttr = bonusLabel+" — sem meta obrigatória";
        }
      } else if (isToday){
        stateClass = dayMet ? "met" : "miss"; icon = dayMet ? "✅" : "⚠️"; countLabel = c+"/"+goal;
      } else {
        var status = streak.dayLog[d];
        var meta = DAY_STATUS_META[status];
        if (meta){
          stateClass = meta.cls; icon = meta.icon; countLabel = c+"/"+goal;
          if (status==="recovered") titleAttr = "Recuperado de graça (bateu a meta no dia seguinte)";
          else if (status==="token") titleAttr = "Coberto por 1 ficha de congelamento";
          else if (status==="forgiven") titleAttr = "Perdoado manualmente";
          else if (status==="broken") titleAttr = "Sequência quebrou aqui";
        } else {
          stateClass = dayMet ? "met" : "miss"; icon = dayMet ? "✅" : "⚠️"; countLabel = c+"/"+goal;
        }
      }

    }).sort(function(a,b){ return (b.total - a.total) || (b.n - a.n); });
    var medals = ["🥇","🥈","🥉"];
    return '<ul class="rank-list">' + rows.map(function(r, i){
      return '<li><span class="m">'+(r.n ? (medals[i] || (i+1)+"º") : "–")+'</span><span class="nm">'+esc(r.att)+'</span>'
        + '<span class="ct">'+r.n+' venda'+plural(r.n,"","s")+'</span><span class="tt">'+brl(r.total)+'</span></li>';
    }).join("") + '</ul>';

  /* ---------- actions ---------- */
  async function registerSale(type, lead){
    var me = state.me;
    if (!me) return;
    var now = new Date();
    var id = newId();
    var pos = todaySalesOf(me).length + 1;
    var val = tierValue(pos, type, dstr(now));
    var doc = { type:type, attendant: me, commission: val, position: pos, rule: "escadinha-v2", ts: now.getTime(), dateStr: dstr(now), timeStr: tstr(now) };
    if (lead){ doc.leadName = lead.name; doc.leadPhone = lead.phone; doc.leadEmail = lead.email; }

    state.localSaleIds[id] = true;
    if (state.seenSaleIds) state.seenSaleIds[id] = true;
    playFeedback(type, val);

    // optimistic: show it immediately, regardless of db latency
    var optimistic = { id: id };
    for (var k in doc) optimistic[k] = doc[k];
    state.sales.unshift(optimistic);
    state.lastAddedId = id;
    render();

    showSnackbar(saleMessage(optimistic, val), true);

    if (state.db){
      try {
        await state.db.collection("sales").doc(id).set(doc);
      } catch(e){
        console.error("[placar] save sale failed", e);
        state.sales = state.sales.filter(function(s){ return s.id!==id; });
        if (state.lastAddedId===id) state.lastAddedId = null;
        render();
        showSnackbar("Não salvou — verifique a conexão e marque de novo.", false);
      }
    }
  }

  // depois de apagar uma venda, as seguintes do mesmo dia sobem de posição:
  // atualiza o valor gravado nelas pra bater com o novo cálculo
  function fixStoredPositions(att, dateStr){
    if (!state.db || dateStr < TIERS_START_DATE) return;
    var cm = commissionMap();
    state.sales.forEach(function(s){
      if (attOf(s) !== att || s.dateStr !== dateStr) return;
      var e = cm[s.id];
      if (!e) return;
      if (s.commission !== e.value || s.position !== e.pos){
        s.commission = e.value; s.position = e.pos;
        state.db.doc("sales/"+s.id).update({ commission: e.value, position: e.pos }).catch(function(err){ console.error("[placar] fix position failed", err); });
      }
    });
  }

  function deleteSale(id){
    if (!id) return;
    var s = state.sales.find(function(x){ return x.id===id; });
    state.sales = state.sales.filter(function(x){ return x.id!==id; });
    if (state.lastAddedId===id) state.lastAddedId = null;
    render();
    if (state.db){
      state.db.doc("sales/"+id).delete().catch(function(e){ console.error("[placar] delete sale failed", e); });
    }
    if (s) fixStoredPositions(attOf(s), s.dateStr);
  }

  // grava só os campos que mudaram (update), pra nunca apagar campos que esta
  // versão não conhece
  async function saveConfigPatch(patch){
    var merged = {};
    for (var k in state.config) merged[k] = state.config[k];
    for (var k2 in patch) merged[k2] = patch[k2];
    state.config = merged;
    render();
    if (!state.db) return;
    var p = {}; for (var k3 in patch) p[k3] = patch[k3];
    p.updatedAt = Date.now();
    try { await state.db.doc("config/settings").update(p); }
    catch(e){
      console.error("[placar] update config failed — tentando set", e);
      try { var full = {}; for (var k4 in merged) full[k4] = merged[k4]; full.updatedAt = Date.now(); await state.db.doc("config/settings").set(full); }
      catch(e2){ console.error("[placar] save config failed", e2); }
    }
  }

  async function saveSettings(){

    var today = todayStr();
    var cur = tiersFor(today);
    var newTiers = cur.map(function(t, i){
      var sEl = document.querySelector('[data-tier-site="'+i+'"]');
      var pEl = document.querySelector('[data-tier-pix="'+i+'"]');
      var sv = sEl ? parseFloat(sEl.value) : t.site;
      var pv = pEl ? parseFloat(pEl.value) : t.pix;
      return { from: t.from, site: (isNaN(sv) || sv<0) ? t.site : sv, pix: (isNaN(pv) || pv<0) ? t.pix : pv };
    });
    var hist = (state.config.tiersHistory || []).map(function(h){ return { from: h.from, tiers: cloneTiers(h.tiers) }; });
    if (JSON.stringify(newTiers) !== JSON.stringify(cur)){
      var startFrom = today < TIERS_START_DATE ? TIERS_START_DATE : today;
      if (hist.length && hist[hist.length-1].from === startFrom) hist[hist.length-1].tiers = newTiers;
      else hist.push({ from: startFrom, tiers: newTiers });
    }

    await saveConfigPatch({ tiersHistory: hist, tiers: hist.length ? hist[hist.length-1].tiers : newTiers });
    var flash = document.getElementById("saved-flash");
    if (flash){ flash.classList.add("show"); setTimeout(function(){ flash.classList.remove("show"); }, 1800); }
  }

  function saveLogin(name, user, pass){
    var u = normLogin(user) || normLogin(name);
    var acc = {}; var cur = state.config.accounts || {};
    for (var k in cur) acc[k] = cur[k];
    var clash = attendants().some(function(n){ return n !== name && ((acc[n] && normLogin(acc[n].user || n) === u) || normLogin(n) === u); });
    if (clash){ showSnackbar("Esse usuário já é de outro atendente — escolha outro.", false); return; }
    var prev = acc[name] || {};
    var entry = { user: u, salt: prev.salt || "", hash: prev.hash || "" };
    if (pass){
      if (pass.length < 4){ showSnackbar("A senha precisa ter pelo menos 4 caracteres.", false); return; }
      entry.salt = newSalt();
      entry.hash = passHash(entry.salt, pass);
    } else if (!entry.hash){
      showSnackbar("Digite uma senha pra "+name+".", false); return;
    }
    acc[name] = entry;
    saveConfigPatch({ accounts: acc });
    showSnackbar("Login de "+name+" salvo ✓ (usuário: "+u+")", false);
  }

  function addAttendant(name){
    name = String(name||"").trim().slice(0, 30);
    if (!name) return;
    var cur = attendants().slice();
    if (cur.some(function(n){ return n.toLowerCase() === name.toLowerCase(); })) return;
    cur.push(name);
    var paidMap = {}; var m = state.config.paidUntilByAttendant || {};
    for (var k in m) paidMap[k] = m[k];
    if (typeof paidMap[name] !== "number") paidMap[name] = Date.now(); // novo atendente começa do zero
    saveConfigPatch({ attendants: cur, paidUntilByAttendant: paidMap });
  }

  function removeAttendant(name){
    var cur = attendants().filter(function(n){ return n !== name; });
    if (!cur.length) return;
    if (state.me === name) logout();
    saveConfigPatch({ attendants: cur });
  }

  async function markAsPaid(att){
    var p = pendingFor(att);
    if (p.total <= 0) return;
    var now = Date.now();
    var periodFrom = p.paidUntil || (p.sales.length ? Math.min.apply(null, p.sales.map(function(s){ return s.ts; })) : now);
    var payout = {
      attendant: att, amount: p.total, salesTotal: p.salesTotal, adjustmentsTotal: p.adjTotal,
      count: p.sales.length, adjustmentsCount: p.adjustments.length,
      periodFrom: periodFrom, periodTo: now, paidAt: now
    };
    var paidMap = {}; var m = state.config.paidUntilByAttendant || {};
    for (var k in m) paidMap[k] = m[k];
    paidMap[att] = now;
    state.payouts.unshift(payout);
    await saveConfigPatch({ paidUntilByAttendant: paidMap });
    if (state.db){
      try { await state.db.collection("payouts").add(payout); } catch(e){ console.error("[placar] mark paid payout failed", e); }

  }

  // medalhas: só celebração visual (não gera mais prêmio em dinheiro)
  function checkMilestones(att){
    var streak = computeStreakState(att);
    var milestones = (state.config.milestones || DEFAULT_MILESTONES).slice().sort(function(a,b){ return a.days-b.days; });
    // domingo/feriado pode pular 2 dias de uma vez — checa a faixa, não só igualdade
    var matched = milestones.filter(function(m){ return m.days > streak.preTodayCount && m.days <= streak.count; });
    return matched.length ? matched[matched.length-1] : null;
  }

  /* ---------- confetti + sound + fly amount ---------- */
  var canvas = document.getElementById("confetti-canvas");
  var ctx = canvas.getContext("2d");
  function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // shared particle pool + a single running loop, so a normal tap-burst and
  // a bigger goal-celebration burst can overlap without clobbering each other
  var confettiParticles = [];
  var confettiRunning = false;

  function burstConfetti(x, y, color1, color2, count){
    if (reduceMotion) return;
    var n = count || 26;
    for (var i=0;i<n;i++){
      var ang = (Math.random()*Math.PI) + Math.PI; // upward-ish spray
      var speed = 4 + Math.random()*6;
      confettiParticles.push({
        x:x, y:y,
        vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed - 2,
        size: 4+Math.random()*4,
        rot: Math.random()*Math.PI*2, vr:(Math.random()-.5)*0.4,
        color: Math.random()<0.5?color1:color2,
        life: 1
      });
    }
    if (!confettiRunning){
      confettiRunning = true;
      requestAnimationFrame(confettiFrame);
    }
  }

  function confettiFrame(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confettiParticles.forEach(function(p){
      p.vy += 0.18;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      p.life -= 0.014;
      if (p.life>0){
        ctx.save();
        ctx.globalAlpha = Math.max(p.life,0);
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
        ctx.restore();
      }
    });
    confettiParticles = confettiParticles.filter(function(p){ return p.life>0; });
    if (confettiParticles.length){
      requestAnimationFrame(confettiFrame);
    } else {
      confettiRunning = false;
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }

  function celebrateGoal(){
    if (reduceMotion) return;
    var money = getComputedStyle(document.documentElement).getPropertyValue("--money").trim() || "#2a8";
    var site = getComputedStyle(document.documentElement).getPropertyValue("--accent-site").trim() || "#0af";
    var pix = getComputedStyle(document.documentElement).getPropertyValue("--accent-pix").trim() || "#fa0";
    var w = window.innerWidth;
    burstConfetti(w*0.5, window.innerHeight*0.3, money, site, 40);
    burstConfetti(w*0.15, window.innerHeight*0.4, money, pix, 26);
    burstConfetti(w*0.85, window.innerHeight*0.4, site, pix, 26);
    chimeGoal();
    if (navigator.vibrate) { try{ navigator.vibrate([15,60,15,60,30]); }catch(e){} }
  }

  function celebrateMilestone(m){
    if (reduceMotion) return;
    var money = getComputedStyle(document.documentElement).getPropertyValue("--money").trim() || "#2a8";
    var site = getComputedStyle(document.documentElement).getPropertyValue("--accent-site").trim() || "#0af";
    var pix = getComputedStyle(document.documentElement).getPropertyValue("--accent-pix").trim() || "#fa0";
    var w = window.innerWidth, h = window.innerHeight;
    burstConfetti(w*0.5, h*0.2, pix, money, 60);
    burstConfetti(w*0.1, h*0.5, site, pix, 34);
    burstConfetti(w*0.9, h*0.5, money, site, 34);
    burstConfetti(w*0.5, h*0.65, pix, site, 34);
    chimeGoal();
    if (navigator.vibrate) { try{ navigator.vibrate([20,50,20,50,20,50,60]); }catch(e){} }
  }

  var audioCtx = null;
  function chime(type){
    if (state.muted) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var t0 = audioCtx.currentTime;
      var freqs = type==="PIX" ? [660, 990] : [520, 780];
      freqs.forEach(function(f, i){
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.value = f;
        g.gain.value = 0.0001;
        o.connect(g); g.connect(audioCtx.destination);
        var start = t0 + i*0.075;
        g.gain.exponentialRampToValueAtTime(0.22, start+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, start+0.22);
        o.start(start); o.stop(start+0.24);
      });
    } catch(e){}
  }

  function chimeGoal(){
    if (state.muted) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var t0 = audioCtx.currentTime;
      var freqs = [523, 659, 784, 1047]; // little ascending arpeggio (C-E-G-C)
      freqs.forEach(function(f, i){
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.value = f;
        g.gain.value = 0.0001;
        o.connect(g); g.connect(audioCtx.destination);
        var start = t0 + i*0.09;
        g.gain.exponentialRampToValueAtTime(0.24, start+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start+0.32);
        o.start(start); o.stop(start+0.34);
      });
    } catch(e){}
  }

  function flyAmount(x, y, text, color){
    if (reduceMotion){ return; }
    var el = document.createElement("div");
    el.className = "fly-amount";
    el.textContent = text;
    el.style.left = x+"px"; el.style.top = y+"px"; el.style.color = color;
    el.style.transform = "translate(-50%,-50%)";
    el.style.opacity = "1";
    el.style.transition = "transform .9s cubic-bezier(.2,.7,.3,1), opacity .9s ease";
    document.body.appendChild(el);
    requestAnimationFrame(function(){
      el.style.transform = "translate(-50%,-140%) scale(1.15)";
      el.style.opacity = "0";
    });
    setTimeout(function(){ el.remove(); }, 950);
  }

  function playFeedback(type, amount){
    var btn = document.getElementById(type==="PIX"?"btn-pix":"btn-site");
    var rect = btn ? btn.getBoundingClientRect() : { left: window.innerWidth/2, top: window.innerHeight/2, width:0, height:0 };
    var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    var c1 = getComputedStyle(document.documentElement).getPropertyValue(type==="PIX"?"--accent-pix":"--accent-site").trim() || "#0af";
    var c2 = getComputedStyle(document.documentElement).getPropertyValue("--money").trim() || "#2a8";
    burstConfetti(cx, cy, c1, c2);
    flyAmount(cx, cy, "+"+brl(amount), c1);
    chime(type);
    if (navigator.vibrate) { try{ navigator.vibrate(18); }catch(e){} }
  }

  /* ---------- boot ---------- */
  render();
  initDb();
})();
</script>

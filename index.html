<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesa Sonora</title>
<meta name="description" content="Soundpad ao vivo para mestrar RPG">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317130f'/%3E%3Cpath d='M9 22V11l14-3v11' stroke='%23d0a54c' stroke-width='2.5' fill='none'/%3E%3Ccircle cx='7' cy='22' r='3' fill='%23d0a54c'/%3E%3Ccircle cx='21' cy='19' r='3' fill='%23d0a54c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#17130f; --bg2:#1f1914; --card:#2a221b; --card2:#332a21; --line:#4a3d30;
  --ink:#eee2c9; --ink2:#b9a88a; --ink3:#86765d;
  --brass:#d0a54c; --brass-ink:#1c150c;
  --music:#7f9fd6; --amb:#86aa6a; --sfx:#e0744a; --danger:#d9534a;
  --display:"Almendra", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);
  background-image:radial-gradient(ellipse at 50% -20%, #3a2c1f 0%, transparent 60%);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font:700 30px/1 var(--display);margin:0;letter-spacing:.01em;color:var(--brass)}
.brand small{color:var(--ink3);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.table-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.chip.on .dot{background:var(--amb);box-shadow:0 0 6px var(--amb)}
.chip.gm{border-color:var(--brass)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{background:var(--card2)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:#7a3a33;color:#f0b3a8}
.btn.danger:hover{background:#3a1f1b}
.btn:disabled{opacity:.5;cursor:default}
.btn svg,.icon-btn svg{width:18px;height:18px;flex:none}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:6px;border:0;background:transparent;color:var(--ink2)}
.icon-btn:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.search{flex:1 1 200px;max-width:280px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg2)}

.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.board .sfx-sec{grid-column:1 / -1}
@media (max-width:820px){.board{grid-template-columns:1fr}}
section.sec{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-head h2{font:700 21px/1.1 var(--display);margin:0}
.sec-head .hint{color:var(--ink3);font-size:13px;margin-right:auto}
.sec-head .swatch{width:10px;height:10px;border-radius:2px;transform:rotate(45deg)}
.music-sec .swatch{background:var(--music)} .amb-sec .swatch{background:var(--amb)} .sfx-sec .swatch{background:var(--sfx)}
.empty{color:var(--ink3);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:8px;text-align:center}

/* music rows */
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-radius:8px;background:var(--card);border:1px solid transparent}
.row .play{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);display:grid;place-items:center;flex:none;color:var(--music)}
.row .play svg{width:16px;height:16px}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .meta{color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.row.active{border-color:var(--music);background:linear-gradient(90deg,rgba(127,159,214,.18),var(--card) 70%)}
.row.active .play{background:var(--music);color:#111a2a;border-color:var(--music)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-left:4px}
.eq i{width:3px;background:var(--music);animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.live-vol{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ink2)}
.live-vol input{flex:1}

/* ambient */
.amb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.amb{position:relative;border-radius:10px;background:var(--card);border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.amb .toggle{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.amb .toggle:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}
.amb .toggle span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:30px;height:17px;border-radius:9px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--ink2);transition:transform .15s}
.amb.on{border-color:var(--amb);background:linear-gradient(180deg,rgba(134,170,106,.16),var(--card))}
.amb.on .sw{background:var(--amb)} .amb.on .sw::after{transform:translateX(13px);background:#fff}
.amb input[type=range]{width:100%}
.amb .tools{position:absolute;top:4px;right:2px}

/* sfx pads */
.pads{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.pad{position:relative;aspect-ratio:1.35;max-width:100%;border-radius:12px;border:1px solid var(--line);
  background:radial-gradient(circle at 30% 20%,#3b2e24,var(--card) 70%);display:flex;flex-direction:column;justify-content:flex-end;
  padding:10px;text-align:left;overflow:hidden;min-width:0;transition:transform .06s}
.pad:hover{border-color:var(--sfx)}
.pad:active{transform:scale(.97)}
.pad .pname{font-weight:700;font-size:15px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pad .key{position:absolute;top:8px;left:10px;font:700 12px/1 var(--body);color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:3px 5px;min-width:20px;text-align:center}
.pad .tools{position:absolute;top:2px;right:2px}
.pad.fire{animation:fire .6s ease-out}
@keyframes fire{0%{box-shadow:0 0 0 0 rgba(224,116,74,.8);border-color:var(--sfx);background:#5a3222}100%{box-shadow:0 0 0 18px rgba(224,116,74,0)}}
.pad-wrap{position:relative;min-width:0}

/* menu */
.menu{position:absolute;z-index:30;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;width:240px;box-shadow:0 12px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px;font-size:14px}
.menu label{display:flex;flex-direction:column;gap:4px;color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.menu input[type=text],.menu select{padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg2);text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.menu .acts{display:flex;gap:6px;justify-content:space-between}
.menu .btn{padding:6px 10px;font-size:13px}

/* upload dialog */
.overlay{position:fixed;inset:0;background:rgba(10,8,6,.72);display:grid;place-items:center;z-index:50;padding:16px}
.dialog{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px}
.dialog h3{font:700 24px/1.1 var(--display);margin:0 0 4px;color:var(--brass)}
.dialog p{color:var(--ink2);margin:0 0 14px;font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{flex:1 1 120px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);text-align:left}
.seg button b{display:block}
.seg button small{color:var(--ink3)}
.seg button[aria-pressed=true]{border-color:var(--brass);background:#3a2f1f}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 14px;text-align:center;color:var(--ink2);cursor:pointer}
.drop.over{border-color:var(--brass);background:rgba(208,165,76,.08)}
.queue{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.qitem{display:flex;gap:10px;align-items:center;font-size:14px;padding:6px 10px;background:var(--card);border-radius:6px}
.qitem .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem .s{color:var(--ink2);font-size:12px;white-space:nowrap}
.qitem.err .s{color:#f0a090}.qitem.ok .s{color:var(--amb)}
.dialog .foot{display:flex;justify-content:flex-end;margin-top:14px}

/* player view */
.player{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.stage{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.stage .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.stage .now{font:700 26px/1.15 var(--display);text-wrap:balance}
.stage .now.none{color:var(--ink3);font-weight:400}
.amb-chips{display:flex;flex-wrap:wrap;gap:6px}
.amb-chips .chip{border-color:var(--amb)}
.sfx-flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(224,116,74,.35),transparent 70%)}
.sfx-flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.last-sfx{font-size:14px;color:var(--ink2);min-height:1.4em}
.last-sfx b{color:var(--sfx)}
.myvol{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.myvol input{flex:1}
.gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(12,9,7,.86);padding:16px}
.gate-card{text-align:center;max-width:420px;display:flex;flex-direction:column;gap:14px;align-items:center}
.gate-card h2{font:700 34px/1.1 var(--display);margin:0;color:var(--brass)}
.gate-card p{margin:0;color:var(--ink2)}
.gate-card .btn{font-size:18px;padding:12px 26px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:8px;z-index:70;font-size:14px;max-width:calc(100% - 32px)}
input[type=range]{accent-color:var(--brass)}
.sub{color:var(--ink3);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* --- Vercel version additions --- */
[hidden]{display:none!important}
img{max-width:100%}
.gate-card input,.login input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);font-size:16px;color:var(--ink)}
.yt-dock{margin-top:22px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.yt-dock .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.yt-dock-inner{display:flex;flex-wrap:wrap;gap:10px}
.yt-dock-inner .yt-item{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);max-width:100%}
.yt-dock-inner iframe{width:240px;height:135px;max-width:100%;border:0;border-radius:6px;background:#000}
.badge-yt{display:inline-block;font:700 10px/1 var(--body);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:#5b1d1d;color:#ffb4a8;margin-left:6px;vertical-align:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:8px 12px;border-bottom:2px solid transparent;color:var(--ink2);font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--brass)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--ink2)}
.field input,.field select{padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:15px;color:var(--ink)}
.login .err{color:#f0a090;font-size:14px;min-height:1.2em}
.btn.small{padding:6px 10px;font-size:13px}
.folders{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;color:var(--ink2)}
.fchip svg{width:14px;height:14px}
.fchip span{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.fchip:hover{background:var(--card2);color:var(--ink)}
.fchip[aria-pressed=true]{border-color:var(--brass);background:#3a2f1f;color:var(--ink)}
.icon-btn.star.on{color:var(--brass)}
.icon-btn svg{width:18px;height:18px}
.pad.fav{border-color:#6b5427}
.badge-side{display:inline-block;font:700 10px/1 var(--body);padding:3px 5px;border-radius:4px;background:#243049;color:#b8c9f0;margin-left:6px;vertical-align:2px}
.sidesel{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.sidesel button{padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-size:13px}
.sidesel button[aria-pressed=true]{border-color:var(--brass);background:#3a2f1f}
.pad .tools{display:flex}
.pad-wrap .tools{position:absolute;top:2px;right:2px;display:flex}
.pad-wrap .tools .icon-btn{width:28px;height:28px}
.pad .pname{padding-right:4px}
.menu{max-height:calc(100vh - 16px);overflow:auto}
.amb .tools{position:static;align-self:flex-end;display:flex;margin-top:-4px}
</style>

</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><h1>Mesa Sonora</h1><small id="roleLbl">carregando…</small></div>
    <div class="table-status" id="tableStatus"></div>
    <button class="btn" id="authBtn" hidden></button>
  </header>
  <div id="view"></div>
  <section class="yt-dock" id="ytDockWrap" hidden>
    <div class="lbl">Tocando do YouTube</div>
    <div class="yt-dock-inner" id="ytDock"></div>
  </section>
</div>
<div id="gate" class="gate" hidden>
  <form class="gate-card" id="gateForm">
    <h2>A mesa está pronta</h2>
    <p>O navegador só toca som depois de um clique. Diga seu nome e entre na mesa para ouvir as músicas, os ambientes e os efeitos que o mestre soltar.</p>
    <input type="text" id="nick" maxlength="30" placeholder="Seu nome ou do personagem" autocomplete="nickname">
    <button class="btn primary" id="joinBtn" type="submit">Entrar na mesa</button>
  </form>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/vendor/supabase.js"></script>
<script src="/app.js"></script>
</body>
</html>
